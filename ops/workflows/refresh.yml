name: refresh-feed
on:
  schedule: [{cron: "0 0,12 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/refresh.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name "XU SIYIN"; git config user.email sinxu.xsy@gmail.com
          git add site/data/items.json && git commit -m "chore: refresh feed" && git push || echo "no changes"
